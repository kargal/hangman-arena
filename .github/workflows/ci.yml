name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    services:
      postgres:   # results database tests (tests/test_standings.py)
        image: postgres:16
        env:
          POSTGRES_USER: arena
          POSTGRES_PASSWORD: arena
          POSTGRES_DB: arena_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arena" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ARENA_TEST_POSTGRES_URL: postgresql://arena:arena@localhost:5432/arena_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,postgres]"
      - run: pytest

  data:
    name: puzzle bank & leaderboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python scripts/validate_bank.py
      - run: python scripts/render_leaderboard.py --check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/server.Dockerfile -t hangman-arena-server:ci .
      - name: smoke test
        run: |
          docker run -d --name arena -e ARENA_ADMIN_TOKEN=ci -p 8080:8080 hangman-arena-server:ci
          for i in $(seq 1 30); do curl -fs localhost:8080/healthz && exit 0; sleep 1; done
          docker logs arena; exit 1
