# Hangman Arena: server + agent sandbox (+ optional model gateway).
#
#   export ARENA_ADMIN_TOKEN=$(openssl rand -hex 16)
#   docker compose -f docker/docker-compose.yml up -d arena
#   docker compose -f docker/docker-compose.yml run --rm agent \
#       python -m arena_runner run --agent claude_code --model claude-opus-5
#
# Non-Anthropic models through the arena gateway (see docs/gateway.md):
#   export OPENAI_API_KEY=... GATEWAY_API_KEY=$(openssl rand -hex 16)
#   docker compose -f docker/docker-compose.yml --profile gateway up -d arena gateway
#   ANTHROPIC_BASE_URL=http://gateway:8090 ANTHROPIC_AUTH_TOKEN=$GATEWAY_API_KEY \
#   docker compose -f docker/docker-compose.yml run --rm agent \
#       python -m arena_runner run --agent claude_code --model gpt-5.6-sol
name: hangman-arena

services:
  arena:
    build:
      context: ..
      dockerfile: docker/server.Dockerfile
    image: hangman-arena-server:0.3.0
    environment:
      ARENA_ADMIN_TOKEN: ${ARENA_ADMIN_TOKEN:?set ARENA_ADMIN_TOKEN}
      ARENA_SEASON: ${ARENA_SEASON:-3}
    volumes:
      - arena-results:/srv/arena/results   # export with: docker compose cp arena:/srv/arena/results ./results
    ports:
      - "${ARENA_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  gateway:
    build:
      context: ..
      dockerfile: docker/gateway.Dockerfile
    image: hangman-arena-gateway:0.3.0
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:?set GATEWAY_API_KEY}
      GATEWAY_LOG_BODIES: ${GATEWAY_LOG_BODIES:-0}
    volumes:
      - gateway-logs:/srv/gateway/logs     # gateway.jsonl: per-request metadata + token usage
    ports:
      - "${GATEWAY_PORT:-8090}:8090"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    profiles: ["gateway"]

  agent:
    build:
      context: ..
      dockerfile: docker/agent.Dockerfile
      args:
        UID: ${UID:-1000}   # match your host uid so runs/ in the mounted checkout is writable
    image: hangman-arena-agent-sandbox:0.3.0
    depends_on:
      arena:
        condition: service_healthy
    working_dir: /home/agent/hangman-arena
    volumes:
      - ..:/home/agent/hangman-arena
    environment:
      ARENA_URL: http://arena:8080
      ARENA_ADMIN_TOKEN: ${ARENA_ADMIN_TOKEN:?set ARENA_ADMIN_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      ANTHROPIC_SMALL_FAST_MODEL: ${ANTHROPIC_SMALL_FAST_MODEL:-}
      ANTHROPIC_DEFAULT_HAIKU_MODEL: ${ANTHROPIC_DEFAULT_HAIKU_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    command: ["python", "-m", "arena_runner", "run", "--agent", "${AGENT:-claude_code}"]
    profiles: ["agent"]

volumes:
  arena-results:
  gateway-logs:
