[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hangman-arena"
version = "0.3.0"
description = "Hangman Arena: a benchmark of puzzle-solving efficiency and in-context learning for LLM agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Hangman Arena maintainers" }]
keywords = ["llm", "agents", "benchmark", "hangman", "in-context-learning", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Game rules are shared with the agent workspace; the server judges with exactly this code.
    "hangman-arena-agent @ git+https://github.com/kargal/hangman-arena-agent.git@v0.3.0",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29",
    "pydantic>=2.6,<3",
    "pyyaml>=6",
    "httpx>=0.27,<1",
    "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1,<4"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
arena-server = "arena_server.__main__:main"
arena-run = "arena_runner.cli:main"
arena-gateway = "arena_gateway.__main__:main"

[project.urls]
Homepage = "https://github.com/kargal/hangman-arena"
"Agent workspace" = "https://github.com/kargal/hangman-arena-agent"
Issues = "https://github.com/kargal/hangman-arena/issues"
Changelog = "https://github.com/kargal/hangman-arena/blob/main/CHANGELOG.md"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["arena_server", "arena_runner", "arena_gateway"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["arena_server", "arena_runner", "arena_gateway"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["arena_server", "arena_runner", "arena_gateway"]

[[tool.mypy.overrides]]
module = ["hangman_engine.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
